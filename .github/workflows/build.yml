name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build Loupe.sln -c Release
      - uses: actions/upload-artifact@v4
        with:
          name: Loupe
          path: src/Loupe/bin/Release/net7.0-windows/Loupe.gha
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src/Loupe/bin/Release/net7.0-windows/Loupe.gha
